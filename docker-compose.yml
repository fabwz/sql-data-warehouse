services:
  postgres:
    image: postgres:16
    container_name: dwh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Source CSV files, read-only, so COPY can read them from the server.
      - ./01_datasets:/datasets:ro

volumes:
  pgdata:
